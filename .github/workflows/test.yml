name: test

on:
  push:
  pull_request:

jobs:
  # The handoff server and the scan SDK's built file. Plain Node, nothing to install.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  # The site build (apps/web) and the scan SDK's source.
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The page and server load packages/scan-sdk/dist, which is committed. If it
      # doesn't match src/, they silently run old code (this once dropped sockets).
      - name: Scan SDK build matches its source
        run: |
          npm run build -w packages/scan-sdk
          if ! git diff --exit-code --stat -- packages/scan-sdk/dist; then
            echo "::error::packages/scan-sdk/dist is out of date. Run 'npm run build -w packages/scan-sdk' and commit the result."
            exit 1
          fi
      - run: npm run typecheck -w packages/scan-sdk
      # The site exactly as Vercel builds it (checks the app's files are all there).
      - run: npm run build
      - name: The app's scripts parse
        run: for f in apps/web/boot.js apps/web/app/planner.js apps/web/roommuse/*.js; do node --check "$f" || exit 1; done
